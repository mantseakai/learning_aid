<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emunah's Mock Exam 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --eng:  #e91e8c; --eng-d: #880e4f;  --eng-l: #fce4ec;
  --fre:  #1565c0; --fre-d: #0d47a1;  --fre-l: #e3f2fd;
  --com:  #7c4dff; --com-d: #4a148c;  --com-l: #ede7f6;
  --sci:  #00897b; --sci-d: #004d40;  --sci-l: #e0f2f1;
  --mat:  #f57c00; --mat-d: #e65100;  --mat-l: #fff3e0;
  --green:#2e7d32; --gl:#e8f5e9;
  --red:  #c62828; --rl:#ffebee;
  --dark: #1a1a2e; --gray:#666; --bg:#f8f6ff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;color:var(--dark)}
.screen{display:none}
.screen.active{display:block}

/* BACK */
.back-btn{position:fixed;top:14px;left:14px;z-index:999;background:#fff;border:2px solid #ddd;
  color:var(--dark);font-weight:800;font-size:.88rem;padding:7px 16px;border-radius:50px;
  text-decoration:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:.2s}
.back-btn:hover{background:var(--dark);color:#fff}

/* HOME SCREEN */
.hero{background:linear-gradient(135deg,#1a1a2e 0%,#4a148c 50%,#e91e8c 100%);
  padding:70px 20px 50px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:40px;
  background:var(--bg);clip-path:ellipse(60% 100% at 50% 100%)}
.hero h1{font-family:'Fredoka One',cursive;font-size:clamp(2rem,6vw,3rem);color:#fff;
  text-shadow:3px 3px 0 rgba(0,0,0,.2)}
.hero p{color:rgba(255,255,255,.85);font-size:1rem;font-weight:700;margin-top:8px}
.hero-badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero-badge{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);
  color:#fff;font-weight:800;font-size:.8rem;padding:5px 14px;border-radius:50px}

.home-main{max-width:960px;margin:0 auto;padding:36px 18px 60px}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;margin-bottom:28px}
.subject-card{background:#fff;border-radius:22px;padding:24px 20px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);border-top:5px solid var(--sc);transition:.2s}
.subject-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sc-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sc-icon{font-size:36px}
.sc-name{font-family:'Fredoka One',cursive;font-size:1.35rem;color:var(--sc)}
.sc-btns{display:flex;gap:10px}
.sc-btn{flex:1;font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;
  padding:9px 0;border-radius:50px;cursor:pointer;border:2px solid var(--sc);transition:.15s}
.sc-btn.learn{background:#fff;color:var(--sc)}
.sc-btn.learn:hover{background:var(--sc);color:#fff}
.sc-btn.test{background:var(--sc);color:#fff}
.sc-btn.test:hover{filter:brightness(1.1)}

.full-mock-btn{display:block;width:100%;padding:18px;font-family:'Fredoka One',cursive;
  font-size:1.4rem;color:#fff;border:none;border-radius:20px;cursor:pointer;
  background:linear-gradient(135deg,#1a1a2e,#4a148c,#e91e8c);
  box-shadow:0 6px 0 rgba(0,0,0,.2);transition:.2s;text-align:center}
.full-mock-btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(0,0,0,.2)}
.full-mock-btn span{display:block;font-family:'Nunito',sans-serif;font-size:.95rem;
  font-weight:700;opacity:.85;margin-top:4px}

/* LEARN SCREEN */
.learn-header{padding:60px 20px 28px;text-align:center}
.learn-header h2{font-family:'Fredoka One',cursive;font-size:clamp(1.8rem,5vw,2.5rem);color:var(--sc,var(--dark))}
.learn-header p{font-size:.95rem;font-weight:700;color:var(--gray);margin-top:6px}
.learn-progress{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.lp-dot{width:12px;height:12px;border-radius:50%;background:#ddd;cursor:pointer;transition:.2s}
.lp-dot.active{background:var(--sc,#888);transform:scale(1.3)}
.lp-dot.done{background:var(--green)}

.flashcard-area{max-width:640px;margin:0 auto;padding:0 18px 40px}
.flashcard{background:#fff;border-radius:24px;padding:32px 28px;
  box-shadow:0 6px 24px rgba(0,0,0,.1);min-height:280px;
  display:flex;flex-direction:column;animation:fadeUp .3s ease}
.fc-tag{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;
  color:var(--sc,#888);margin-bottom:14px}
.fc-rule{font-family:'Fredoka One',cursive;font-size:clamp(1.2rem,4vw,1.6rem);
  color:var(--dark);margin-bottom:16px;line-height:1.3}
.fc-body{font-size:.95rem;font-weight:700;color:#444;line-height:1.7;flex:1}
.fc-body .hl{font-weight:900}
.fc-body .good{color:var(--green);font-weight:900}
.fc-body .bad{color:var(--red);font-weight:900}
.fc-example{margin-top:14px;background:var(--bg);border-radius:12px;padding:12px 16px;
  font-size:.88rem;font-weight:700;color:var(--dark);border-left:4px solid var(--sc,#888)}
.fc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}
.fc-nav-btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;
  padding:9px 22px;border-radius:50px;cursor:pointer;border:2px solid;transition:.15s}
.fc-nav-btn.prev{background:#fff;border-color:#ddd;color:#666}
.fc-nav-btn.prev:hover{background:#f5f5f5}
.fc-nav-btn.next{background:var(--sc,#888);color:#fff;border-color:var(--sc,#888)}
.fc-nav-btn.next:hover{filter:brightness(1.1)}
.fc-counter{font-family:'Fredoka One',cursive;font-size:1rem;color:var(--gray)}
.learn-to-test-btn{display:block;margin:0 auto;padding:14px 36px;font-family:'Fredoka One',cursive;
  font-size:1.2rem;color:#fff;background:var(--sc,#888);border:none;border-radius:50px;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:.2s}
.learn-to-test-btn:hover{transform:translateY(-2px)}

/* TEST SCREEN */
.test-header{padding:50px 20px 0;max-width:700px;margin:0 auto}
.test-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.test-subject-tag{font-family:'Fredoka One',cursive;font-size:1rem;color:var(--sc,#888)}
.test-qnum{font-family:'Fredoka One',cursive;font-size:.95rem;color:var(--gray)}
.test-timer{font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--dark);
  background:#fff;padding:6px 16px;border-radius:50px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.test-timer.warn{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.progress-bar{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:var(--sc,#888);border-radius:4px;transition:width .4s ease}

.test-main{max-width:700px;margin:0 auto;padding:20px 18px 60px}
.question-card{background:#fff;border-radius:22px;padding:28px 24px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);margin-bottom:20px;animation:fadeUp .3s ease}
.q-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;
  color:var(--sc,#888);margin-bottom:12px}
.q-text{font-size:clamp(1rem,3vw,1.15rem);font-weight:800;line-height:1.5;color:var(--dark)}
.q-text .snippet{display:block;background:var(--bg);border-left:4px solid var(--sc,#888);
  border-radius:0 10px 10px 0;padding:10px 14px;margin-top:10px;font-style:italic;
  font-size:.9rem;font-weight:700;color:#444}

.options{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.opt-btn{font-family:'Nunito',sans-serif;font-weight:700;font-size:.95rem;
  text-align:left;padding:13px 18px;border-radius:14px;cursor:pointer;
  border:2px solid #e0e0e0;background:#fff;color:var(--dark);transition:.15s;
  display:flex;align-items:center;gap:10px}
.opt-btn:hover:not(:disabled){border-color:var(--sc,#888);background:var(--bg)}
.opt-btn .opt-letter{width:28px;height:28px;border-radius:50%;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-weight:900;
  font-size:.82rem;flex-shrink:0;color:var(--sc,#888)}
.opt-btn.correct{background:var(--gl);border-color:var(--green);color:var(--green)}
.opt-btn.correct .opt-letter{background:var(--green);color:#fff}
.opt-btn.wrong{background:var(--rl);border-color:var(--red);color:var(--red)}
.opt-btn.wrong .opt-letter{background:var(--red);color:#fff}
.opt-btn.reveal{background:var(--gl);border-color:var(--green);color:var(--green)}
.opt-btn.reveal .opt-letter{background:var(--green);color:#fff}
.opt-btn:disabled{cursor:default}

.explain-box{background:#fff9c4;border-left:4px solid #f9a825;border-radius:0 12px 12px 0;
  padding:12px 16px;margin-top:14px;font-size:.88rem;font-weight:700;color:#5d4037;
  display:none;animation:fadeUp .3s}
.explain-box.show{display:block}

.next-btn{width:100%;padding:14px;font-family:'Fredoka One',cursive;font-size:1.2rem;
  color:#fff;background:var(--sc,#888);border:none;border-radius:50px;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.15);transition:.2s;margin-top:8px;display:none}
.next-btn.show{display:block}
.next-btn:hover{transform:translateY(-2px)}

/* RESULTS SCREEN */
.results-wrap{max-width:700px;margin:0 auto;padding:40px 18px 60px}
.results-hero{text-align:center;padding:50px 20px 30px;
  background:linear-gradient(135deg,#1a1a2e,#4a148c,#e91e8c)}
.results-hero h2{font-family:'Fredoka One',cursive;font-size:clamp(1.8rem,5vw,2.6rem);color:#fff}
.results-hero .score-big{font-family:'Fredoka One',cursive;font-size:clamp(3rem,10vw,5rem);
  color:var(--yellow,#fdd835);text-shadow:3px 3px 0 rgba(0,0,0,.2)}
.results-hero .grade-msg{color:rgba(255,255,255,.9);font-size:1.05rem;font-weight:700;margin-top:8px}
.results-hero::after{content:'';display:block;height:40px;background:var(--bg);
  clip-path:ellipse(60% 100% at 50% 100%);margin-top:20px}

.subject-result{background:#fff;border-radius:18px;padding:18px 20px;
  margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.07);
  display:flex;align-items:center;gap:16px}
.sr-icon{font-size:28px;flex-shrink:0}
.sr-info{flex:1}
.sr-name{font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--sc)}
.sr-bar{height:10px;background:#e0e0e0;border-radius:5px;overflow:hidden;margin-top:6px}
.sr-fill{height:100%;border-radius:5px;background:var(--sc);transition:width .8s ease}
.sr-score{font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--dark);white-space:nowrap}

.wrong-answers{margin-top:24px}
.wa-heading{font-family:'Fredoka One',cursive;font-size:1.3rem;color:var(--dark);margin-bottom:14px}
.wa-item{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;
  border-left:4px solid var(--sc,var(--red));box-shadow:0 2px 8px rgba(0,0,0,.06)}
.wa-subj{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--sc,#888);margin-bottom:4px}
.wa-q{font-weight:800;font-size:.9rem;margin-bottom:6px;color:var(--dark)}
.wa-yours{font-size:.85rem;font-weight:700;color:var(--red)}
.wa-correct{font-size:.85rem;font-weight:700;color:var(--green);margin-top:2px}

.results-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.results-btn{padding:14px;font-family:'Fredoka One',cursive;font-size:1.1rem;
  border:none;border-radius:50px;cursor:pointer;transition:.2s;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.results-btn:hover{transform:translateY(-2px)}
.results-btn.retry{background:linear-gradient(135deg,#4a148c,#e91e8c);color:#fff}
.results-btn.home{background:#fff;color:var(--dark);border:2px solid #ddd}

/* UTILS */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.yellow{color:#f9a825;font-weight:900}
@media(max-width:500px){.results-btns{grid-template-columns:1fr}.sc-btns{flex-direction:column}}
</style>
</head>
<body>

<!-- ══════════════════════════════
     SCREEN: HOME
══════════════════════════════ -->
<div id="screen-home" class="screen active">
  <div class="hero">
    <h1>🌟 Emunah's Mock Exams</h1>
    <p>Choose a subject to Learn or Test — or take the Full Mock!</p>
    <div class="hero-badges">
      <span class="hero-badge">📚 5 Subjects</span>
      <span class="hero-badge">✏️ 50 Questions</span>
      <span class="hero-badge">🎓 Cambridge Year 3</span>
    </div>
  </div>
  <div class="home-main">
    <div class="subject-grid" id="subjectGrid"></div>
    <button class="full-mock-btn" onclick="startFullMock()">
      🏆 Take the Full Mock Exam
      <span>All 5 subjects · 50 questions · Timed · Results breakdown</span>
    </button>
  </div>
</div>

<!-- ══════════════════════════════
     SCREEN: LEARN
══════════════════════════════ -->
<div id="screen-learn" class="screen">
  <button class="back-btn" onclick="goHome()">← Home</button>
  <div class="learn-header">
    <h2 id="learnTitle"></h2>
    <p id="learnSubtitle">Study each card, then take the practice test!</p>
    <div class="learn-progress" id="learnDots"></div>
  </div>
  <div class="flashcard-area">
    <div class="flashcard" id="flashcard"></div>
    <div class="fc-nav">
      <button class="fc-nav-btn prev" onclick="prevCard()">← Back</button>
      <span class="fc-counter" id="fcCounter"></span>
      <button class="fc-nav-btn next" onclick="nextCard()" id="fcNextBtn">Next →</button>
    </div>
    <div style="text-align:center;margin-top:24px">
      <button class="learn-to-test-btn" id="learnTestBtn" onclick="startSubjectTest(currentSubject, true)">
        ✏️ Now take the practice test →
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════
     SCREEN: TEST
══════════════════════════════ -->
<div id="screen-test" class="screen">
  <button class="back-btn" onclick="confirmBack()">← Back</button>
  <div class="test-header">
    <div class="test-meta">
      <span class="test-subject-tag" id="testSubjectTag"></span>
      <span class="test-qnum" id="testQNum"></span>
      <span class="test-timer" id="testTimer">⏱ 40:00</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="test-main">
    <div class="question-card" id="questionCard">
      <div class="q-label" id="qLabel"></div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="optionsEl"></div>
      <div class="explain-box" id="explainBox"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
  </div>
</div>

<!-- ══════════════════════════════
     SCREEN: RESULTS
══════════════════════════════ -->
<div id="screen-results" class="screen">
  <div class="results-hero">
    <h2>🎉 Well done, Emunah!</h2>
    <div class="score-big" id="resultsBig"></div>
    <div class="grade-msg" id="gradeMsg"></div>
  </div>
  <div class="results-wrap">
    <div id="subjectResults"></div>
    <div class="wrong-answers" id="wrongAnswers"></div>
    <div class="results-btns">
      <button class="results-btn retry" onclick="retryTest()">🔄 Try Again</button>
      <button class="results-btn home" onclick="goHome()">🏠 Home</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════ */
const SUBJECTS = {
  english: {
    name:'English', icon:'📚', color:'#e91e8c', dark:'#880e4f', light:'#fce4ec',
    label:'English Language · Year 3'
  },
  french: {
    name:'French', icon:'🇫🇷', color:'#1565c0', dark:'#0d47a1', light:'#e3f2fd',
    label:'French · Year 3'
  },
  computing: {
    name:'Computing', icon:'💻', color:'#7c4dff', dark:'#4a148c', light:'#ede7f6',
    label:'Computing · Year 3'
  },
  science: {
    name:'Science', icon:'🔬', color:'#00897b', dark:'#004d40', light:'#e0f2f1',
    label:'Science · Year 3'
  },
  maths: {
    name:'Maths', icon:'🔢', color:'#f57c00', dark:'#e65100', light:'#fff3e0',
    label:'Mathematics · Year 3'
  }
};

/* ── FLASHCARDS ── */
const CARDS = {
  english: [
    {
      tag:'Vocabulary in Context',
      rule:'What does "boasted" mean?',
      body:'<b>Boasted</b> = <span class="good">bragged proudly</span> — talking about yourself with too much pride.\n<span class="bad">❌ NOT lowered, NOT smiled</span>\n\n<b>Squabbled</b> = <span class="good">quarrelled noisily</span> — arguing about something small.',
      example:'"I\'m the best flyer!" the owl boasted. → He was BRAGGING / showing off.'
    },
    {
      tag:'Synonyms for "Said"',
      rule:'Good writers replace "said" with better words',
      body:'Match the feeling to the word:\n• Showing off → <span class="good">boasted</span>\n• Making an owl sound → <span class="good">hooted</span>\n• Tired/sad → <span class="good">sighed</span>\n• Being kind/generous → <span class="good">expressed</span>\n• Being grumpy → <span class="good">grumbled</span>',
      example:'"Hunting was hard tonight!" their mother sighed. (She was tired → sighed ✅)'
    },
    {
      tag:'Text Types',
      rule:'Fiction + Narrative — NOT Adventure or Fairy Tale',
      body:'<span class="good">✅ Fiction</span> = made-up story (owls don\'t really talk)\n<span class="good">✅ Narrative</span> = tells events in order (beginning → middle → end)\n<span class="bad">❌ Adventure</span> = needs danger/journey/quest\n<span class="bad">❌ Fairy Tale</span> = needs magic, kings, queens OR "once upon a time"',
      example:'"The Three Little Owls" = Fiction ✅ + Narrative ✅'
    },
    {
      tag:'To-Be Verbs',
      rule:'The 8 to-be verbs — learn them all!',
      body:'<span class="good">am · is · are · was · were · be · been · being</span>\n\nThey describe a STATE, not an action.\n<span class="bad">❌ "swooped", "flew", "sang"</span> = action verbs, NOT to-be verbs\n\nWatch for contractions hiding them:\nYou\'re = You <span class="good">are</span> · I\'m = I <span class="good">am</span> · He\'s = He <span class="good">is</span>',
      example:'Paragraph 3: "You <b>are</b> the best flyer" + "He <b>was</b> just happy" → are & was ✅'
    },
    {
      tag:'Prepositions',
      rule:'Prepositions show WHERE, WHEN or DIRECTION',
      body:'Common prepositions: <span class="good">in · on · at · under · over · into · beneath · beside · across · above · behind · through · between</span>\n\n<span class="bad">❌ "looked" is a VERB, not a preposition</span>\n<span class="bad">❌ "road" is a NOUN, not a preposition</span>',
      example:'"She looked <b>at</b> the owl." → AT is the preposition (shows direction) ✅'
    },
    {
      tag:'Tricky Contractions',
      rule:'shan\'t and won\'t are IRREGULAR!',
      body:'<span class="bad">❌ shall not → "shall\'nt"</span>\n<span class="good">✅ shall not → shan\'t</span> (the word changes shape!)\n\n<span class="bad">❌ will not → "willn\'t"</span>\n<span class="good">✅ will not → won\'t</span>\n\nAll others follow the pattern: remove letters, add apostrophe where they were.',
      example:'must not → mustn\'t ✅ · they are → they\'re ✅ · I will → I\'ll ✅'
    },
    {
      tag:'Homophones',
      rule:'Words that SOUND the same but have DIFFERENT spellings',
      body:'• <span class="good">steel</span> (strong metal) vs <span class="good">steal</span> (to take wrongly)\n• <span class="good">mail</span> (letters/post) vs <span class="good">male</span> (boy/man)\n• <span class="good">court</span> (tennis court / law court) vs <span class="good">caught</span> (past tense of catch)\n• reign (king\'s rule) vs rain (water from sky)',
      example:'"The bridge is made of <b>steel</b>." · "Don\'t <b>steal</b>!" → same sound, different meaning ✅'
    }
  ],

  french: [
    {
      tag:'Numbers 40–69',
      rule:'quarante (40), cinquante (50), soixante (60)',
      body:'40 = <span class="good">quarante</span>\n41 = quarante et un\n49 = <span class="good">quarante-neuf</span> <span class="bad">(NOT "quatre-neuf"!)</span>\n50 = <span class="good">cinquante</span>\n60 = <span class="good">soixante</span>',
      example:'49 = quarante (40) + neuf (9) = quarante-neuf ✅'
    },
    {

    {q:'The preserved skeleton of a fish found in rock is which type of fossil?',
     opts:['Trace fossil','Body fossil','Mould fossil','Cast fossil'],
     ans:'Body fossil',
     explain:'Preserved body parts (bones, shells, teeth) = body fossil.'},
    {q:'"What <b>organism</b> made this fossil?" (The fossil shows a fish skeleton)',
     opts:['Body fossil','Cast fossil','Fish','Trace fossil'],
     ans:'Fish',
     explain:'Organism = the living thing. The fossil shows a FISH skeleton → organism = fish. "Body fossil" is the TYPE, not the organism!'},
    {q:'Gravity is a force that pulls objects:',
     opts:['Away from Earth','Sideways across the ground','Towards the centre of the Earth','Upwards into the sky'],
     ans:'Towards the centre of the Earth',
     explain:'Gravity always pulls towards Earth\'s centre — which is why things fall DOWN when dropped.'}
  ],

  maths: [
    {q:'<b>"Quarter past six"</b> in digital form is:',
     opts:['06:45','06:30','06:15','07:15'],
     ans:'06:15',
     explain:'Quarter PAST = 15 mins AFTER the hour = :15. Quarter past six = 06:15. 06:45 is quarter TO seven!'},
    {q:'<b>"Quarter to nine"</b> in digital form is:',
     opts:['09:15','09:45','08:45','08:15'],
     ans:'08:45',
     explain:'Quarter TO nine = 15 mins BEFORE 9 = 08:45. It\'s the hour BEFORE nine at :45.'},
    {q:'<b>270 + ___ = 1000</b>',
     opts:['80830','830','720','730'],
     ans:'730',
     explain:'1000 − 270 = 730. Check: 270 + 730 = 1000 ✅'},
    {q:'<b>35 + ___ = 100</b>',
     opts:['75','55','65','45'],
     ans:'65',
     explain:'100 − 35 = 65. Check: 35 + 65 = 100 ✅. 35 + 75 = 110 ❌'},
    {q:'<b>4 metres = ___ centimetres</b>',
     opts:['40 cm','4000 cm','400 cm','14 cm'],
     ans:'400 cm',
     explain:'1 metre = 100 cm. So 4 metres = 4 × 100 = 400 cm. NOT 40 (that would be ×10).'},
    {q:'<b>¾ kilometre = ___ metres</b>',
     opts:['34 m','75 m','7500 m','750 m'],
     ans:'750 m',
     explain:'1 km = 1000 m. ¾ × 1000 = 750 m.'},
    {q:'From this list, which are <b>multiples of 4</b>? &nbsp; 8 &nbsp; 14 &nbsp; 4 &nbsp; 6 &nbsp; 36 &nbsp; 18',
     opts:['8 and 36 only','14, 6 and 18','8, 4 and 36','4 and 8 only'],
     ans:'8, 4 and 36',
     explain:'4÷4=1✅ · 8÷4=2✅ · 36÷4=9✅. But 14÷4=3r2❌ · 6÷4=1r2❌ · 18÷4=4r2❌'},
    {q:'<b>764 − 392 = ?</b>',
     opts:['572','472','272','372'],
     ans:'372',
     explain:'Units: 4−2=2. Tens: borrow → 16−9=7 (hundreds becomes 6). Hundreds: 6−3=3. Answer: 372.'},
    {q:'A rectangle is <b>3 cm × 4 cm</b>. What is its area?',
     opts:['7 sq cm','14 sq cm','12 sq cm','10 sq cm'],
     ans:'12 sq cm',
     explain:'Area = length × width = 3 × 4 = 12 square centimetres.'},
    {q:'<b>200 centimetres = ___ metres</b>',
     opts:['20 m','0.2 m','2000 m','2 m'],
     ans:'2 m',
     explain:'200 ÷ 100 = 2 metres. To go from cm to m, divide by 100.'}
  ]
};

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let currentSubject = null;
let currentMode = null;    // 'learn' | 'practice' | 'mock'
let currentCardIdx = 0;
let testQuestions = [];
let testAnswers = [];
let currentQIdx = 0;
let isFullMock = false;
let timerInterval = null;
let timeLeft = 0;
let isPracticeMode = false; // shows explanation after each Q

/* ═══════════════════════════════════════════════
   HOME SCREEN BUILD
═══════════════════════════════════════════════ */
function buildHome() {
  const grid = document.getElementById('subjectGrid');
  Object.entries(SUBJECTS).forEach(([key, s]) => {
    const card = document.createElement('div');
    card.className = 'subject-card';
    card.style.setProperty('--sc', s.color);
    card.innerHTML = `
      <div class="sc-header">
        <span class="sc-icon">${s.icon}</span>
        <span class="sc-name">${s.name}</span>
      </div>
      <div class="sc-btns">
        <button class="sc-btn learn" style="--sc:${s.color}" onclick="startLearn('${key}')">📖 Learn</button>
        <button class="sc-btn test"  style="--sc:${s.color};background:${s.color}" onclick="startSubjectTest('${key}',false)">✏️ Practice Test</button>
      </div>`;
    grid.appendChild(card);
  });
}

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function goHome() {
  stopTimer();
  showScreen('home');
}

function confirmBack() {
  if (currentQIdx > 0 && currentQIdx < testQuestions.length) {
    if (!confirm('Leave the test? Your progress will be lost.')) return;
  }
  stopTimer();
  goHome();
}

/* ═══════════════════════════════════════════════
   LEARN MODE
═══════════════════════════════════════════════ */
function startLearn(subjectKey) {
  currentSubject = subjectKey;
  currentCardIdx = 0;
  const s = SUBJECTS[subjectKey];
  document.getElementById('learnTitle').textContent = s.icon + ' ' + s.name + ' — Study Cards';
  document.getElementById('screen-learn').style.setProperty('--sc', s.color);
  document.getElementById('learnTestBtn').style.background = s.color;
  buildDots(subjectKey);
  renderCard(subjectKey, 0);
  showScreen('learn');
}

function buildDots(subjectKey) {
  const dots = document.getElementById('learnDots');
  dots.innerHTML = '';
  CARDS[subjectKey].forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'lp-dot' + (i === 0 ? ' active' : '');
    d.onclick = () => { currentCardIdx = i; renderCard(subjectKey, i); };
    dots.appendChild(d);
  });
}

function renderCard(subjectKey, idx) {
  const cards = CARDS[subjectKey];
  const c = cards[idx];
  const fc = document.getElementById('flashcard');
  const bodyHtml = c.body.replace(/\n/g, '<br>');
  fc.innerHTML = `
    <div class="fc-tag">${c.tag}</div>
    <div class="fc-rule">${c.rule}</div>
    <div class="fc-body">${bodyHtml}</div>
    ${c.example ? `<div class="fc-example">💡 ${c.example}</div>` : ''}`;
  document.getElementById('fcCounter').textContent = `${idx+1} / ${cards.length}`;
  document.getElementById('fcNextBtn').textContent = idx === cards.length-1 ? 'Done ✓' : 'Next →';
  // dots
  document.querySelectorAll('.lp-dot').forEach((d,i) => {
    d.classList.toggle('active', i === idx);
    d.classList.toggle('done', i < idx);
  });
}

function nextCard() {
  const cards = CARDS[currentSubject];
  if (currentCardIdx < cards.length - 1) {
    currentCardIdx++;
    renderCard(currentSubject, currentCardIdx);
  }
}
function prevCard() {
  if (currentCardIdx > 0) {
    currentCardIdx--;
    renderCard(currentSubject, currentCardIdx);
  }
}

/* ═══════════════════════════════════════════════
   TEST MODE
═══════════════════════════════════════════════ */
function startSubjectTest(subjectKey, practiceAfterLearn) {
  currentSubject = subjectKey;
  isFullMock = false;
  isPracticeMode = practiceAfterLearn;
  testQuestions = shuffle([...QUESTIONS[subjectKey]]);
  startTest(SUBJECTS[subjectKey].name, 20 * 60); // 20 mins per subject
}

function startFullMock() {
  isFullMock = true;
  isPracticeMode = false;
  currentSubject = null;
  // Interleave 2 questions from each subject
  const allQs = [];
  Object.entries(QUESTIONS).forEach(([key, qs]) => {
    shuffle([...qs]).slice(0, 10).forEach(q => allQs.push({...q, _subject: key}));
  });
  testQuestions = shuffle(allQs);
  startTest('Full Mock Exam', 40 * 60);
}

function startTest(label, seconds) {
  testAnswers = new Array(testQuestions.length).fill(null);
  currentQIdx = 0;
  const tagEl = document.getElementById('testSubjectTag');
  tagEl.textContent = label;
  // set subject colour
  const s = isFullMock ? null : SUBJECTS[currentSubject];
  const col = s ? s.color : '#4a148c';
  document.getElementById('screen-test').style.setProperty('--sc', col);
  timeLeft = seconds;
  updateTimer();
  stopTimer();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) { clearInterval(timerInterval); finishTest(); }
  }, 1000);
  renderQuestion();
  showScreen('test');
}

function updateTimer() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const el = document.getElementById('testTimer');
  el.textContent = `⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.classList.toggle('warn', timeLeft <= 120);
}

function stopTimer() { clearInterval(timerInterval); }

function renderQuestion() {
  const q = testQuestions[currentQIdx];
  const total = testQuestions.length;
  const s = isFullMock ? (q._subject ? SUBJECTS[q._subject] : null) : SUBJECTS[currentSubject];
  const col = s ? s.color : '#4a148c';
  document.getElementById('screen-test').style.setProperty('--sc', col);

  // subject tag
  const subjectLabel = isFullMock && s ? `${s.icon} ${s.name}` : (s ? `${s.icon} ${s.label}` : 'Full Mock');
  document.getElementById('testSubjectTag').textContent = subjectLabel;
  document.getElementById('testQNum').textContent = `Q${currentQIdx+1} of ${total}`;

  // progress
  document.getElementById('progressFill').style.width = `${(currentQIdx / total) * 100}%`;

  document.getElementById('qLabel').textContent = `Question ${currentQIdx+1}`;
  document.getElementById('qText').innerHTML = q.q;
  document.getElementById('explainBox').textContent = '';
  document.getElementById('explainBox').classList.remove('show');
  document.getElementById('nextBtn').classList.remove('show');

  const opts = document.getElementById('optionsEl');
  opts.innerHTML = '';
  const letters = ['A','B','C','D'];
  shuffle([...q.opts]).forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span>${opt}`;
    btn.dataset.val = opt;
    btn.addEventListener('click', () => answerQ(opt, q, btn));
    opts.appendChild(btn);
  });
}

function answerQ(chosen, q, btn) {
  // Disable all
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  const isCorrect = chosen === q.ans;
  testAnswers[currentQIdx] = { chosen, correct: isCorrect, q };

  document.querySelectorAll('.opt-btn').forEach(b => {
    if (b.dataset.val === q.ans) b.classList.add(isCorrect && b === btn ? 'correct' : 'reveal');
  });
  if (!isCorrect) btn.classList.add('wrong');

  // Explanation in practice mode
  if (isPracticeMode || isFullMock === false) {
    const eb = document.getElementById('explainBox');
    eb.textContent = (isCorrect ? '✅ ' : '❌ ') + q.explain;
    eb.classList.add('show');
  }

  document.getElementById('nextBtn').classList.add('show');
  const isLast = currentQIdx === testQuestions.length - 1;
  document.getElementById('nextBtn').textContent = isLast ? 'See Results →' : 'Next Question →';
}

function nextQuestion() {
  if (currentQIdx < testQuestions.length - 1) {
    currentQIdx++;
    renderQuestion();
  } else {
    finishTest();
  }
}

/* ═══════════════════════════════════════════════
   RESULTS
═══════════════════════════════════════════════ */
function finishTest() {
  stopTimer();
  const answered = testAnswers.filter(Boolean);
  const correct = answered.filter(a => a.correct).length;
  const total = testQuestions.length;
  const pct = Math.round((correct / total) * 100);

  document.getElementById('resultsBig').textContent = `${correct} / ${total}`;
  const grade = pct >= 90 ? '🌟 Outstanding! You\'re exam-ready!' :
                pct >= 75 ? '⭐ Great work! Nearly there!' :
                pct >= 60 ? '👍 Good effort — keep practising!' :
                            '💪 Keep going — practice makes perfect!';
  document.getElementById('gradeMsg').textContent = `${pct}% — ${grade}`;

  // Subject breakdown
  const subjEl = document.getElementById('subjectResults');
  subjEl.innerHTML = '<div style="font-family:\'Fredoka One\',cursive;font-size:1.3rem;color:var(--dark);margin-bottom:16px">📊 Your Results by Subject</div>';

  if (isFullMock) {
    // Group by subject
    const bySubj = {};
    testAnswers.filter(Boolean).forEach(a => {
      const sk = a.q._subject || currentSubject;
      if (!bySubj[sk]) bySubj[sk] = {correct:0, total:0};
      bySubj[sk].total++;
      if (a.correct) bySubj[sk].correct++;
    });
    Object.entries(SUBJECTS).forEach(([key, s]) => {
      const r = bySubj[key] || {correct:0, total:0};
      addSubjectResult(subjEl, s, r.correct, r.total);
    });
  } else {
    const s = SUBJECTS[currentSubject];
    addSubjectResult(subjEl, s, correct, total);
  }

  // Wrong answers
  const wrongEl = document.getElementById('wrongAnswers');
  const wrongs = testAnswers.filter(a => a && !a.correct);
  wrongEl.innerHTML = '';
  if (wrongs.length) {
    wrongEl.innerHTML = `<div class="wa-heading">📝 Review — Questions to Work On (${wrongs.length})</div>`;
    wrongs.forEach(a => {
      const sk = a.q._subject || currentSubject;
      const s = SUBJECTS[sk] || {};
      const div = document.createElement('div');
      div.className = 'wa-item';
      div.style.setProperty('--sc', s.color || '#888');
      div.innerHTML = `
        <div class="wa-subj">${s.icon||''} ${s.name||'General'}</div>
        <div class="wa-q">${a.q.q.replace(/<[^>]*>/g,'')}</div>
        <div class="wa-yours">Your answer: ${a.chosen}</div>
        <div class="wa-correct">✅ Correct: ${a.q.ans}</div>`;
      wrongEl.appendChild(div);
    });
  } else {
    wrongEl.innerHTML = '<div style="text-align:center;padding:20px;font-family:\'Fredoka One\',cursive;font-size:1.3rem;color:var(--green)">🎉 Perfect score! Amazing work!</div>';
  }

  showScreen('results');
}

function addSubjectResult(container, s, correct, total) {
  const pct = total ? Math.round((correct/total)*100) : 0;
  const div = document.createElement('div');
  div.className = 'subject-result';
  div.style.setProperty('--sc', s.color);
  div.innerHTML = `
    <span class="sr-icon">${s.icon}</span>
    <div class="sr-info">
      <div class="sr-name">${s.name}</div>
      <div class="sr-bar"><div class="sr-fill" style="width:0%" data-w="${pct}"></div></div>
    </div>
    <div class="sr-score">${correct}/${total} <span style="font-size:.8rem;color:var(--gray)">(${pct}%)</span></div>`;
  container.appendChild(div);
  // animate bar
  requestAnimationFrame(() => {
    const fill = div.querySelector('.sr-fill');
    if (fill) setTimeout(() => fill.style.width = fill.dataset.w + '%', 100);
  });
}

function retryTest() {
  if (isFullMock) startFullMock();
  else startSubjectTest(currentSubject, isPracticeMode);
}

/* ═══════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════ */
function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
buildHome();
</script>
